        <section>
            <h2>Join Our Team</h2>
            <p>we are always excited to meet new creative snd skilled minds! Fill out the form below if you would love to join our team at Jennspace interiors.</p>

            <form action="#" method="post">
<label for="name">Full Name:</label>
<input type="text" id="name" name="name" required ><br>


<label for="email">Email Address:</label>
<input type="email" id="email" name="email" required><br>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" required><br>


<label for="position">position or skills </label>
<input type="text" id="position" name="position" placeholder="e.g interior designer">
<br>
<br>

<label for="message"> <i>why do you want to join us?</i></label>  
<textarea id="message" name="message" rows="5" placeholder="your message......"></textarea><br><br>
<button type="submit">submit Application</button><br>

            </form>
        </section>
